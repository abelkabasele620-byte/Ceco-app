<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#0d5952" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.9" />
    </linearGradient>

    <!-- Star Glow / Accent -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with safe-area padding for maskable PWA icons -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#cecoBg)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shield Base (Centered inside maskable safe zone) -->
  <g filter="url(#shadow)" transform="translate(256, 236) scale(14.5)">
    <!-- Shield contour -->
    <path
      d="M0 -9 L7 -5.5 V1 C7 6.5 0 10.5 0 10.5 C0 10.5 -7 6.5 -7 1 V-5.5 Z"
      fill="url(#shieldGrad)"
      stroke="#10b981"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Shield inner protective outline -->
    <path
      d="M0 -7.5 L5.5 -4.7 V0.8 C5.5 5.2 0 8.5 0 8.5 C0 8.5 -5.5 5.2 -5.5 0.8 V-4.7 Z"
      fill="#065f46"
    />

    <!-- Checkmark representing verified / secured escrow -->
    <path
      d="M-2.8 0.4 L-0.8 2.4 L3.2 -1.6"
      fill="none"
      stroke="#34d399"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- DRC Golden Star Accent (top right of shield) -->
  <g filter="url(#glow)" transform="translate(356, 120)">
    <polygon
      points="0,-24 6.8,-7.4 24,-6.2 11,-4.2 14.8,13 0,4.2 -14.8,13 -11,-4.2 -24,-6.2 -6.8,-7.4"
      fill="url(#starGrad)"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <!-- Sparkle core -->
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- C'ECO Wordmark Emblem on Bottom -->
  <text
    x="256"
    y="428"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="2"
    text-anchor="middle"
    fill="#ffffff"
  >C’ECO</text>

  <rect x="334" y="398" width="54" height="22" rx="6" fill="#10b981" />
  <text
    x="361"
    y="414"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="12"
    font-weight="800"
    letter-spacing="1.5"
    text-anchor="middle"
    fill="#022c22"
  >RDC</text>
</svg>
